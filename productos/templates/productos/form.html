{% extends "base.html" %}
{% block titulo %}{{ titulo }} · Minimarket{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <a href="{% url 'productos:lista' %}" class="small">&larr; Productos</a>
    <h1 class="h3 mb-3">{{ titulo }}</h1>
    <form method="post" class="card card-body" novalidate>
      {% csrf_token %}
      {% include "includes/campos_form.html" %}
      <button type="submit" class="btn btn-primary">Guardar</button>
    </form>
  </div>
</div>
{% endblock %}

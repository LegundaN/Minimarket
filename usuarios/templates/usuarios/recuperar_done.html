{% extends "base.html" %}
{% block titulo %}Revisá tu mail · Minimarket{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-9 col-md-6 col-lg-5">
    <div class="card tarjeta-acceso mt-4"><div class="card-body p-4 text-center">
      <i class="bi bi-envelope-check display-5 text-primary"></i>
      <h1 class="h4 mt-2">Revisá tu mail</h1>
      <p class="text-muted">Si el mail corresponde a un usuario activo, te llegó un link para elegir una contraseña nueva. Si no lo ves, fijate en la carpeta de spam.</p>
      <a href="{% url 'login' %}" class="btn btn-outline-primary">Volver a ingresar</a>
    </div></div>
  </div>
</div>
{% endblock %}

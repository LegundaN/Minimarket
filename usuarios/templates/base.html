<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Minimarket{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  {% if user.is_authenticated %}
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand">Minimarket</span>
      <div class="d-flex align-items-center gap-2">
        <span class="text-light small d-none d-sm-inline">{{ user.get_full_name|default:user.username }}</span>
        {# En Django 5 el logout tiene que ser por POST #}
        <form method="post" action="{% url 'logout' %}" class="m-0">
          {% csrf_token %}
          <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
        </form>
      </div>
    </div>
  </nav>
  {% endif %}

  <main class="container py-4">
    {% for m in messages %}
      <div class="alert alert-success alert-dismissible fade show">{{ m }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
    {% endfor %}
    {% block contenido %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

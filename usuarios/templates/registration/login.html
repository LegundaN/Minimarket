{% extends "base.html" %}
{% block titulo %}Ingresar · Minimarket{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-9 col-md-6 col-lg-4">
    <div class="card tarjeta-acceso mt-4">
      <div class="mm-login-encabezado">
        <span class="mm-marca-icono"><i class="bi bi-shop"></i></span>
        <h1 class="h3">Minimarket</h1>
        <div class="small opacity-75">Sistema de ventas y caja</div>
      </div>
      <div class="card-body p-4">
        {% if form.errors %}
          <div class="alert alert-danger py-2">Usuario o contraseña incorrectos.</div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="id_username" class="form-label">Usuario</label>
            <input type="text" name="username" id="id_username" class="form-control form-control-lg"
                   value="{{ form.username.value|default:'' }}" autofocus required>
          </div>
          <div class="mb-4">
            <label for="id_password" class="form-label">Contraseña</label>
            <input type="password" name="password" id="id_password" class="form-control form-control-lg" required>
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit" class="btn btn-primary btn-lg w-100"><i class="bi bi-box-arrow-in-right"></i> Ingresar</button>
        </form>
        <a href="{% url 'password_reset' %}" class="d-block text-center small mt-3">¿Olvidaste tu contraseña?</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}

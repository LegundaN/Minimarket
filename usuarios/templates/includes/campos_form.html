{# Dibuja todos los campos de un formulario de Django con estilo Bootstrap #}
{% for e in form.non_field_errors %}<div class="alert alert-danger py-2">{{ e }}</div>{% endfor %}
{% for field in form %}
  <div class="mb-3">
    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
    {{ field }}
    {% for e in field.errors %}<div class="text-danger small mt-1">{{ e }}</div>{% endfor %}
    {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
  </div>
{% endfor %}
